name: Update dashboard data

# Runs the anonymizing pull job on a schedule and commits the refreshed data.json.
# The dashboard (index.html) reads data.json, so visitors just refresh the page.

on:
  schedule:
    # Daily at 01:30 UTC. CommCare refreshes its feeds once a day; set this to
    # shortly AFTER that refresh (times are UTC; adjust to your context).
    - cron: '30 3 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write         # allows the job to commit the updated data.json

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull feeds, anonymize, write data.json
        env:
          COMMCARE_EMAIL:   ${{ secrets.COMMCARE_EMAIL }}
          COMMCARE_API_KEY: ${{ secrets.COMMCARE_API_KEY }}
          CASE_FEED_URL:    ${{ secrets.CASE_FEED_URL }}
          SAMPLE_FEED_URL:  ${{ secrets.SAMPLE_FEED_URL }}
          PCR_FEED_URL:     ${{ secrets.PCR_FEED_URL }}
          NAAT_FEED_URL:    ${{ secrets.NAAT_FEED_URL }}
          OUT_PATH:         data.json
        run: python scripts/commcare_pull_anonymize.py

      - name: Commit refreshed data (only if it changed)
        run: |
          git config user.name  "acf-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data change; nothing to commit."
          else
            git commit -m "Update data $(date -u +%FT%TZ)"
            git push
          fi
